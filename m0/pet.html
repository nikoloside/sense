<title>Sense 桌宠</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 桌宠（0030）：谁在干活谁站在桌上——引擎用 Claude 就是 Claude，用 DeepSeek 就是 DeepSeek，通话时是接电话的那位；都闲着是口袋精。
   每个动作都对应口袋里真发生的事（进卡、碎卡、引擎在跑、任务能领），不演假的。图在 assets/characters（docs/art/characters.md）。 */
/*__THEMES__*/
html,body{margin:0;height:100%;background:transparent;overflow:hidden;-webkit-user-select:none;user-select:none;cursor:default}
body{font-family:var(--f-pixel);position:relative}
#pet{position:absolute;left:50%;bottom:0;width:164px;height:164px;transform:translateX(-50%);cursor:grab;-webkit-user-drag:none}
#pet.bob{animation:bob 1.6s ease-in-out infinite}#pet.hop{animation:hop .5s ease-in-out infinite}#pet.shake{animation:shk .12s linear infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-3px)}}@keyframes hop{50%{transform:translateX(-50%) translateY(-8px)}}@keyframes shk{50%{transform:translateX(calc(-50% + 3px))}}
.bubble{position:absolute;left:6px;right:6px;bottom:166px;display:flex;justify-content:center;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.bubble.show{opacity:1;transform:none}
.bubble.go span{pointer-events:auto;cursor:pointer}.bubble.go span:hover{background:var(--gold)}
.bubble span{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:4px 8px;font-size:12px;line-height:1.35;max-width:160px;text-align:center;box-shadow:0 2px 0 var(--ink);position:relative;word-break:break-all}
.bubble span::after{content:"";position:absolute;left:50%;bottom:-7px;width:8px;height:8px;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.mark{position:absolute;left:calc(50% + 40px);bottom:140px;font-size:20px;color:var(--danger);text-shadow:0 2px 0 var(--paper);pointer-events:none;display:none}
.mark.show{display:block;animation:mk 1s steps(2) infinite}
.mark.z{color:var(--chalk-2);font-size:15px;animation:zz 2.4s linear infinite}
@keyframes mk{50%{transform:translateY(-3px)}}
@keyframes zz{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(10px,-22px);opacity:0}}
.spark{position:absolute;width:6px;height:6px;background:var(--gold);pointer-events:none;animation:sp .8s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.callst{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:none;align-items:center;gap:5px;white-space:nowrap;background:var(--ink);color:var(--paper);font-size:11px;padding:2px 8px;border-radius:9px;pointer-events:none}
.callst.show{display:flex}.callst i{width:7px;height:7px;border-radius:50%;background:var(--chalk-2)}
.callst[data-s=idle] i{background:#5cb85c}.callst[data-s=hearing] i{background:#5cb85c;animation:mk .6s steps(2) infinite}.callst[data-s=thinking] i,.callst[data-s=searching] i,.callst[data-s=reading] i{background:var(--gold);animation:mk .8s steps(2) infinite}.callst[data-s=speaking] i{background:#4f7bd1}
@media (prefers-reduced-motion:reduce){.mark.show,.mark.z,#pet.bob,#pet.hop,#pet.shake{animation:none}.spark{display:none}}
</style>
<body>
<div class="bubble" id="bub"><span id="bubt"></span></div>
<div class="mark" id="mark">!</div>
<div class="callst" id="callst" role="status" aria-live="polite"><i></i><span></span></div>
<img id="pet" alt="桌宠" draggable="false">
<script>
(function(){
const T=window.__TAURI__;const invoke=T.core.invoke;const ev=T.event;
const $=s=>document.querySelector(s);const cv=$("#pet");
const RM=matchMedia("(prefers-reduced-motion: reduce)");
/* 每个状态用哪一帧；眨眼、口型在同一姿势的帧之间切。 */
const FRAMES=["idle","idle_blink","idle_talk_a","idle_talk_b","busy","busy_blink","eat","cheer","crack","alert","sleep","wave"];
const WHO=["claude","deepseek","pouch","claude-m","deepseek-m","pouch-m"];const src=(w,f)=>"characters/"+w+"/"+f+".png";
WHO.forEach(w=>FRAMES.forEach(f=>{const i=new Image();i.src=src(w,f);}));
let S=null,mood="wave",moodUntil=Date.now()+2500,blinkAt=Date.now()+3000,lastEv=null,dragOver=false,talk=null;
/* 桌上站谁只由作者手动选（快捷菜单 → 桌上是谁），不跟着引擎或通话自己换。 */
function who(){return (S&&S.petWho||"pouch")+(S&&S.petMale?"-m":"");}
function draw(){const now=Date.now();const m=dragOver?"eat":mood;
  const blink=now>blinkAt&&now<blinkAt+160;if(now>blinkAt+160)blinkAt=now+2500+Math.random()*3500;
  let f={idle:"idle",busy:"busy",eat:"eat",cheer:"cheer",crack:"crack",alert:"alert",sleep:"sleep",wave:"wave"}[m]||"idle";
  if(talk&&talk.level>0.04&&(m==="idle"||m==="alert"))f=talk.level>0.18?"idle_talk_b":"idle_talk_a";
  else if(blink&&(f==="idle"||f==="busy"))f+="_blink";
  const want=src(who(),f);if(cv.getAttribute("src")!==want)cv.setAttribute("src",want);
  cv.className=RM.matches?"":m==="cheer"||m==="eat"?"hop":m==="crack"?"shake":m==="sleep"||talk?"":"bob";}
setInterval(()=>{if(moodUntil&&Date.now()>moodUntil){moodUntil=0;mood=base();marks();}draw();},120);
function base(){if(!S)return"idle";const E=S.engine||{};if(E.working||E.busy||E.taste)return"busy";if(E.off)return"sleep";if(S.imgAsk||S.crumble.length||S.qReady.length||(S.cap&&(S.cap.kept>=S.cap.total-3||S.cap.silver>S.cap.silverCap)))return"alert";return"idle";}
function setMood(m,ms){mood=m;moodUntil=ms?Date.now()+ms:0;marks();draw();}
function marks(){const k=$("#mark");const m=mood;k.className="mark";if(m==="alert"){k.textContent="!";k.classList.add("show");}else if(m==="sleep"){k.textContent="z";k.classList.add("show","z");}}
let bubT=null;
/* 气泡说的是某张卡（吃到一张新卡、有 NEW）时可以点，点了打开那张卡。 */
let bubCard=null;
function say(t,ms,id){if(!t)return;$("#bubt").textContent=t+(id?" ›":"");bubCard=id||null;$("#bub").classList.toggle("go",!!id);$("#bub").classList.add("show");clearTimeout(bubT);bubT=setTimeout(()=>{$("#bub").classList.remove("show","go");bubCard=null;},ms||6000);}
function sparks(){if(RM.matches)return;for(let i=0;i<8;i++){const s=document.createElement("i");s.className="spark";s.style.left=(60+Math.random()*60)+"px";s.style.bottom=(90+Math.random()*40)+"px";s.style.setProperty("--dx",(Math.random()-.5)*80+"px");s.style.setProperty("--dy",-(20+Math.random()*50)+"px");document.body.append(s);setTimeout(()=>s.remove(),900);}}
function react(e){const K={eat:["eat",2400],crack:["crack",1500],cheer:["cheer",2000],find:["cheer",1800],gold:["cheer",2600]}[e.kind]||["idle",0];
  setMood(K[0],K[1]);say(e.text,e.id?9000:6000,e.id);if(e.kind==="cheer"||e.kind==="gold")sparks();}
let lastAsk=null;
ev.listen("sense://summary",e=>{const first=!S;S=e.payload;document.documentElement.dataset.theme=S.theme||"cream";
  if(S.imgAsk&&S.imgAsk.at!==lastAsk){lastAsk=S.imgAsk.at;say("剪贴板里有张新图，点我收",9000);}
  if(S.ev&&(first?false:(!lastEv||S.ev.at>lastEv)))react(S.ev);if(S.ev)lastEv=Math.max(lastEv||0,S.ev.at);
  if(!moodUntil){const was=mood;mood=base();if(mood==="busy"&&was!=="busy"&&(S.engine.taste||S.engine.busy))say(S.engine.taste?"在整理你的品味…":"在查「"+S.engine.busy+"」…",5000);}
  callLabel();
  if(S.callEnd&&S.callEnd.at!==lastEnd){if(lastEnd!==undefined&&Date.now()-S.callEnd.at<5000)say(S.callEnd.reason==="你挂断了"||S.callEnd.reason==="挂了"?"挂了 · "+S.callEnd.s+" 秒":"电话断了："+S.callEnd.reason,8000);lastEnd=S.callEnd.at;}
  marks();draw();});
let lastEnd;
const CALL_T={boot:"启动语音服务",mic:"开麦克风",connecting:"连接中",idle:"在听",hearing:"你在说",thinking:"在想",searching:"在查网页",reading:"在读网页",speaking:"在说"};
function callLabel(){const el=$("#callst");const c=S&&S.call;el.classList.toggle("show",!!c);if(!c)return;el.dataset.s=c.state||"";el.querySelector("span").textContent="通话 · "+(CALL_T[c.state]||c.state||"");}
/* 通话时主窗口按播放音量推口型（0030） */
ev.listen("sense://talk",e=>{talk=e.payload&&e.payload.who?e.payload:null;});
ev.listen("sense://pet-drag",e=>{const k=e.payload.kind;if(k==="enter"){dragOver=true;say("给我吧",3000);}else if(k==="leave"){dragOver=false;}else{dragOver=false;
  if(e.payload.n){setMood("eat",2400);say("收到 "+e.payload.n+" 张，正在认…",5000);}else say("只吃图片（png / jpg / gif / webp）",4000);}draw();});
/* 拖动、单击、双击 */
let down=null,moved=false,clickT=null;
let downAt=0;
cv.addEventListener("mousedown",e=>{if(e.button!==0)return;down={x:e.screenX,y:e.screenY};moved=false;downAt=performance.now();});
addEventListener("mousemove",e=>{if(!down||moved)return;if(Math.hypot(e.screenX-down.x,e.screenY-down.y)>3){moved=true;down=null;invoke("pet_drag");}});
addEventListener("mouseup",e=>{if(!down)return;down=null;if(moved)return;
  if(clickT){clearTimeout(clickT);clickT=null;invoke("show_main");return;}
  const at=downAt;clickT=setTimeout(()=>{clickT=null;const r=cv.getBoundingClientRect();invoke("menu_toggle",{x:r.left,y:r.top,w:r.width,h:r.height,pressedMsAgo:performance.now()-at});},230);});
addEventListener("blur",()=>{down=null;});
cv.addEventListener("contextmenu",e=>{e.preventDefault();const r=cv.getBoundingClientRect();invoke("menu_toggle",{x:r.left,y:r.top,w:r.width,h:r.height});});
cv.addEventListener("mouseenter",()=>{if(!S||$("#bub").classList.contains("show"))return;const bits=[S.nNew?"NEW "+S.nNew:"",S.crumble.length?S.crumble.length+" 张快碎了":"",S.qReady.length?S.qReady.length+" 个任务能领":"",S.cap&&S.cap.silver>S.cap.silverCap?"在跟 "+S.cap.silver+"/"+S.cap.silverCap+"，该融合了":S.cap&&S.cap.kept>=S.cap.total-3?"口袋 "+S.cap.kept+"/"+S.cap.total+"，快满了":""].filter(Boolean);say(bits.length?bits.join(" · "):"口袋里 "+S.live+" 张卡",S.nNew&&S.newId?5000:2500,S.nNew?S.newId:null);});
$("#bubt").addEventListener("click",e=>{e.stopPropagation();if(!bubCard)return;const id=bubCard;$("#bub").classList.remove("show","go");bubCard=null;invoke("show_main");ev.emitTo("main","sense://cmd",{cmd:"card",arg:id});});
/* 有卡快碎时，隔一阵提一句 */
setInterval(()=>{if(S&&S.crumble.length&&!moodUntil){const c=S.crumble[0];say("「"+c.title.slice(0,14)+"」"+(c.left<1?"今天就碎了":"还剩 "+Math.ceil(c.left)+" 天就碎了"),7000);}},40*60e3);
ev.emitTo("main","sense://cmd",{cmd:"need",arg:null});marks();draw();
})();
</script>
</body>
