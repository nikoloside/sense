<title>Niko 的口袋</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a card table. Pocket = hand of cards in a grid; Table = agent slots in a row; Quests and Draw are side games.
   One committed look: dark felt table, paper cards, pixel type for anything that is "game". */
/*THEMES{*/
:root{
  --f-pixel:"DotGothic16", ui-monospace, "Hiragino Sans", "PingFang SC", monospace;
  --f-body:"Noto Sans SC", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
  --r:6px;
  --k-decision:#d9643a; --k-recommendation:#8a6fd1; --k-person:#d06a8a; --k-follow:#2f9a92;
  --k-interest:#7f9a33; --k-quote:#4f7bd1; --k-collection:#c08a2a; --k-work:#3f8fb8;
  --stone:#a39c92; --bronze:#c4773b; --silver:#9fb0bf; --gold:#e3a72f;
  --danger:#d0453a; --ok:#4f9a64;
}
/* Themes. felt/chalk names are historical: --felt = page, --felt-2 = panel, --chalk = text on page. */
:root,[data-theme="cream"]{
  --hdr:#e8762c; --hdr-2:#b4561c; --hdr-ink:#ffffff; --hdr-sel:#fffaf0; --hdr-sel-ink:#b4561c;color-scheme:light;
  --felt:#f6ead3; --felt-2:#fff7e8; --felt-line:#e6cfa6; --chalk:#3a2416; --chalk-2:#8a6a4e;
  --paper:#fffdf7; --paper-2:#f3e4c8; --ink:#2e1f14; --ink-2:#7a6450;
  --accent:#e8762c; --accent-2:#b4561c; --on-accent:#fff;
  --deep:#fff1dc; --deep-2:#fbe3c0; --deep-ink:#3a2416; --deep-ink-2:#8a5a2a; --deep-line:#e0b47a;
  --scrim:rgba(58,36,22,.35); --vignette:rgba(232,118,44,.10); --shadow:rgba(120,70,30,.22); --sink:rgba(232,118,44,.07);
  --bg-a:#f6ead3; --bg-b:#f3e3c6; --bg-c:#f0dcba; --bg-d:#ecd3ab; --bg-e:#e8cb9e;}
[data-theme="pink"]{
  --hdr:#ec5f8f; --hdr-2:#c23f6e; --hdr-ink:#ffffff; --hdr-sel:#ffffff; --hdr-sel-ink:#c23f6e;color-scheme:light;
  --felt:#fff4f7; --felt-2:#ffffff; --felt-line:#f6cddb; --chalk:#4a2433; --chalk-2:#a8778d;
  --paper:#ffffff; --paper-2:#fde7ee; --ink:#3d1f2b; --ink-2:#8f6577;
  --accent:#ec5f8f; --accent-2:#c23f6e; --on-accent:#fff;
  --deep:#fff0f5; --deep-2:#ffe1ec; --deep-ink:#4a2433; --deep-ink-2:#b2557c; --deep-line:#f2a9c2;
  --scrim:rgba(74,36,51,.3); --vignette:rgba(236,95,143,.08); --shadow:rgba(194,63,110,.18); --sink:rgba(236,95,143,.06);
  --bg-a:#fff4f7; --bg-b:#ffeef3; --bg-c:#fde7ee; --bg-d:#fbdfe9; --bg-e:#f9d6e3;}
[data-theme="red"]{
  --hdr:#d93b3b; --hdr-2:#a82424; --hdr-ink:#ffffff; --hdr-sel:#ffffff; --hdr-sel-ink:#a82424;color-scheme:light;
  --felt:#fbf6f3; --felt-2:#ffffff; --felt-line:#efd0c9; --chalk:#3a1717; --chalk-2:#9a6b66;
  --paper:#ffffff; --paper-2:#f8e6e1; --ink:#2f1414; --ink-2:#8a5e58;
  --accent:#d93b3b; --accent-2:#a82424; --on-accent:#fff;
  --deep:#fff3f0; --deep-2:#fbe2dc; --deep-ink:#3a1717; --deep-ink-2:#a8433b; --deep-line:#eaa79c;
  --scrim:rgba(58,23,23,.3); --vignette:rgba(217,59,59,.07); --shadow:rgba(168,36,36,.18); --sink:rgba(217,59,59,.05);
  --bg-a:#fbf6f3; --bg-b:#f9f0ec; --bg-c:#f7eae5; --bg-d:#f4e3dd; --bg-e:#f1dbd4;}
[data-theme="sky"]{
  --hdr:#4a78d0; --hdr-2:#2f58a8; --hdr-ink:#ffffff; --hdr-sel:#ffffff; --hdr-sel-ink:#2f58a8;color-scheme:light;
  --felt:#f1f5fa; --felt-2:#ffffff; --felt-line:#cfdcec; --chalk:#1f2c3d; --chalk-2:#6b7f97;
  --paper:#ffffff; --paper-2:#e7eef7; --ink:#1b2636; --ink-2:#64768c;
  --accent:#4a78d0; --accent-2:#2f58a8; --on-accent:#fff;
  --deep:#eef3fa; --deep-2:#e0e9f6; --deep-ink:#1f2c3d; --deep-ink-2:#3f63a8; --deep-line:#a9c0e3;
  --scrim:rgba(31,44,61,.3); --vignette:rgba(74,120,208,.07); --shadow:rgba(47,88,168,.16); --sink:rgba(74,120,208,.05);
  --bg-a:#f1f5fa; --bg-b:#ecf1f8; --bg-c:#e6edf6; --bg-d:#e0e8f3; --bg-e:#dae3f0;}
[data-theme="felt"]{
  --hdr:#0f2421; --hdr-2:#081815; --hdr-ink:#e9efe9; --hdr-sel:#e8c25a; --hdr-sel-ink:#1f1d1a;color-scheme:dark;
  --felt:#16302d; --felt-2:#1d3c38; --felt-line:#2b524c; --chalk:#e9efe9; --chalk-2:#a9bcb6;
  --paper:#f1eadb; --paper-2:#e4dac6; --ink:#1f1d1a; --ink-2:#5b554c;
  --accent:#e8c25a; --accent-2:#b98a2a; --on-accent:#1f1d1a; --gold:#e8c25a; --silver:#cdd5dc; --bronze:#b9763f; --stone:#8f8b84;
  --deep:#3b2a1a; --deep-2:#2a1e14; --deep-ink:#f3e3c7; --deep-ink-2:#e5cfa8; --deep-line:#7a5a3a;
  --scrim:rgba(5,12,11,.6); --vignette:rgba(4,10,9,.55); --shadow:rgba(0,0,0,.35); --sink:rgba(0,0,0,.2);
  --bg-a:#102825; --bg-b:#14302d; --bg-c:#193833; --bg-d:#214640; --bg-e:#2e5448;}
/*}THEMES*/
html,body{height:100%}
body{background:var(--felt);color:var(--chalk);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);color:var(--hdr-ink);
  box-shadow:0 0 0 100vmax var(--hdr),0 4px 0 100vmax var(--hdr-2);clip-path:inset(0 -100vmax -4px);
  padding-block:12px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-pixel);font-size:22px;font-weight:400;margin:0;letter-spacing:.04em}
.brand h1 small{font-size:12px;color:var(--chalk-2);margin-left:8px;letter-spacing:.08em}
.purse{display:flex;gap:10px;font-family:var(--f-pixel);font-size:13px;font-variant-numeric:tabular-nums}
.purse span{display:inline-flex;align-items:center;gap:4px}
.gem{width:10px;height:10px;display:inline-block;image-rendering:pixelated;box-shadow:inset -2px -2px 0 var(--shadow)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{font-family:var(--f-pixel);font-size:14px;background:transparent;color:var(--chalk-2);border:2px solid transparent;border-radius:var(--r);padding:6px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--on-accent);background:var(--accent);border-color:var(--accent);box-shadow:0 3px 0 var(--accent-2)}
.tabs button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--chalk-2)}
main{padding-top:16px;display:flex;flex-direction:column;gap:22px}
h2.sec{font-family:var(--f-pixel);font-weight:400;font-size:15px;letter-spacing:.08em;margin:0;color:var(--chalk);display:flex;align-items:center;gap:8px}
h2.sec em{font-style:normal;color:var(--chalk-2);font-size:12px;letter-spacing:0}
.note{font-size:13px;color:var(--chalk-2);max-width:64ch;margin:0}

/* search */
.search{display:flex;flex-direction:column;gap:10px}
.search input[type=search]{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:10px 12px;border-radius:var(--r);border:2px solid var(--felt-line);background:var(--felt-2);color:var(--chalk)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-pixel);font-size:12px;display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:var(--r);border:2px solid var(--felt-line);background:transparent;color:var(--chalk-2);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--chalk);color:var(--chalk);background:var(--felt-2)}
.chip canvas{width:14px;height:14px;image-rendering:pixelated}
select.attr{font:inherit;font-size:12px;background:var(--felt-2);color:var(--chalk);border:2px solid var(--felt-line);border-radius:var(--r);padding:4px 6px;max-width:100%}

/* card grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-radius:6px;cursor:pointer;
  border:3px solid var(--tier,var(--stone));box-shadow:0 3px 0 var(--shadow);min-width:0;text-align:left;font:inherit;padding:0;overflow:hidden;
  transition:transform .15s ease, box-shadow .15s ease}
.card:hover{transform:translateY(-3px) rotate(-.6deg);box-shadow:0 7px 0 var(--shadow)}
.card .art{display:block;width:100%;aspect-ratio:8/5;image-rendering:pixelated;background:var(--paper-2)}
.card .face{padding:8px 9px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .eb{font-family:var(--f-pixel);font-size:11px;display:flex;align-items:center;gap:5px;color:var(--kc)}
.card .eb canvas{width:12px;height:12px;image-rendering:pixelated}
.card .eb .tier{margin-left:auto;color:var(--ink-2)}
.card .t{font-weight:700;font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.card .attrs{font-size:11px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.stone{--tier:var(--stone);filter:saturate(.75)}
.card.stone .art{opacity:.8}
.card.bronze{--tier:var(--bronze)}
.card.silver{--tier:var(--silver)}
.card.gold{--tier:var(--gold);box-shadow:0 3px 0 var(--shadow),0 0 0 2px color-mix(in srgb,var(--gold) 40%,transparent)}
.card.gold::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,236,170,.45) 50%,transparent 65%);background-size:250% 100%;animation:shine 3.2s linear infinite;mix-blend-mode:soft-light}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
.card .badge{position:absolute;top:6px;left:6px;font-family:var(--f-pixel);font-size:10px;background:var(--ink);color:var(--paper);padding:1px 5px;border-radius:2px}
.card .stack{position:absolute;top:6px;right:6px;font-family:var(--f-pixel);font-size:10px;background:var(--silver);color:var(--ink);padding:1px 5px;border-radius:2px}
.empty{font-size:13px;color:var(--chalk-2);padding:18px;border:2px dashed var(--felt-line);border-radius:6px;text-align:center}

/* fusion strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.fuse{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--felt-2);border:2px solid var(--felt-line);border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--chalk);font:inherit;max-width:320px;text-align:left}
.fuse .mini{width:22px;height:30px;border-radius:3px;border:2px solid var(--tier);background:var(--paper);display:inline-block;flex:0 0 auto}
.fuse b{font-family:var(--f-pixel);font-weight:400;font-size:13px}
.fuse small{display:block;color:var(--chalk-2);font-size:11px}

/* table */
.agents{display:flex;gap:6px;flex-wrap:wrap}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:640px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
.slot{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot .lab{font-family:var(--f-pixel);font-size:11px;color:var(--chalk-2);display:flex;justify-content:space-between;gap:4px}
.slot .well{min-height:150px;border:2px dashed var(--felt-line);border-radius:6px;display:flex;align-items:stretch;justify-content:center;background:var(--sink)}
.slot .well button.add{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--f-pixel);color:var(--chalk-2);font-size:13px}
.slot .well .card{flex:1}
.slot.locked .well{opacity:.5}
.slot .rm{font-size:11px;background:none;border:none;color:var(--chalk-2);cursor:pointer;text-decoration:underline;padding:0;align-self:flex-start}
.ask{display:flex;gap:8px;flex-wrap:wrap}
.ask input{flex:1 1 240px;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:var(--r);border:2px solid var(--felt-line);background:var(--felt-2);color:var(--chalk)}
.btn{font-family:var(--f-pixel);font-size:14px;padding:9px 16px;border-radius:var(--r);border:2px solid var(--felt-line);background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn.ghost{background:transparent;color:var(--chalk);border-color:var(--felt-line)}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.res{background:var(--paper);color:var(--ink);border:3px solid var(--stone);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;animation:deal .45s cubic-bezier(.2,.9,.3,1.2) both}
.res h3{margin:0;font-size:15px;line-height:1.35;text-wrap:balance}
.res .k{font-family:var(--f-pixel);font-size:11px;color:var(--ink-2)}
.res p{margin:0;font-size:13px}
.res a{color:var(--k-quote);word-break:break-all;font-size:12px}
.pops{display:flex;flex-wrap:wrap;gap:6px}
.pop{font-family:var(--f-pixel);font-size:11px;background:var(--ink);color:var(--accent);padding:2px 6px;border-radius:2px;animation:pop .5s ease both}
.res .row{display:flex;gap:6px;margin-top:auto}
.res .row button{flex:1}
.res.kept{border-color:var(--bronze)}
.res.gone{opacity:.35}
@keyframes deal{from{transform:translateY(-30px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.tag-unverified{font-family:var(--f-pixel);font-size:10px;color:var(--danger)}

/* quests */
.quests{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.quest{background:linear-gradient(180deg,var(--deep),var(--deep-2));border:3px solid var(--bronze);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--deep-ink)}
.quest h3{margin:0;font-family:var(--f-pixel);font-weight:400;font-size:16px}
.quest .due{font-family:var(--f-pixel);font-size:12px;color:var(--accent)}
.quest .qs{display:flex;gap:8px;flex-wrap:wrap}
.quest .qslot{flex:1 1 80px;min-height:56px;border:2px dashed var(--deep-line);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:none;color:var(--deep-ink-2);font-family:inherit;padding:6px;text-align:center}
.quest .qslot.filled{border-style:solid;border-color:var(--accent);color:var(--deep-ink)}
.quest .reward{font-size:13px;color:var(--deep-ink-2)}
.quest.done{border-color:var(--accent)}

/* draw */
.hand{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hand .card{width:150px;flex:0 0 auto}
.hand .card.picked{outline:3px solid var(--accent);outline-offset:3px}
.hand .card .ord{position:absolute;bottom:6px;right:6px;font-family:var(--f-pixel);background:var(--accent);color:var(--ink);padding:0 6px;border-radius:2px}
.qbox{background:var(--felt-2);border:2px solid var(--felt-line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:12px}
.qbox .qq{font-family:var(--f-pixel);font-size:17px;text-wrap:balance}
.qbox textarea,.sheet textarea{font:inherit;font-size:14px;width:100%;box-sizing:border-box;min-height:64px;border-radius:var(--r);border:2px solid var(--felt-line);background:var(--felt);color:var(--chalk);padding:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* attributes */
.attrlist{display:flex;flex-direction:column;gap:10px}
.attr-row{background:var(--felt-2);border:2px solid var(--felt-line);border-radius:6px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;cursor:pointer;color:var(--chalk);font:inherit;text-align:left}
.attr-row b{font-size:15px;font-weight:700}
.attr-row .why{grid-column:1/-1;font-size:13px;color:var(--chalk-2)}
.attr-row .meter{font-family:var(--f-pixel);font-size:12px;white-space:nowrap;align-self:start}
.attr-row .st{font-family:var(--f-pixel);font-size:11px;color:var(--ok)}
.attr-row .st.candcard{color:var(--chalk-2)}
.pips{display:inline-flex;gap:2px;vertical-align:middle}
.pips i{width:7px;height:7px;background:var(--felt-line);display:inline-block}
.pips i.on{background:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--felt-2);color:var(--chalk);width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:10px 10px 0 0;border-top:3px solid var(--tier,var(--stone));
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:10px;border:3px solid var(--tier,var(--stone))}}
.sheet .top{display:flex;gap:14px;align-items:flex-start}
.sheet .top .card{width:132px;flex:0 0 auto;cursor:default}
.sheet .top .card:hover{transform:none}
.sheet h3{margin:0;font-size:18px;line-height:1.35;text-wrap:balance}
.sheet .meta{font-family:var(--f-pixel);font-size:12px;color:var(--chalk-2)}
.sheet p{margin:0}
.sheet .ev{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.sheet .ev li{font-size:13px;border-left:3px solid var(--felt-line);padding-left:8px}
.sheet .ev .w{display:block;font-family:var(--f-pixel);font-size:11px;color:var(--chalk-2)}
.sheet .achip{display:flex;flex-direction:column;gap:2px;background:var(--felt);border:2px solid var(--felt-line);border-radius:4px;padding:8px}
.sheet .achip b{font-size:14px}
.sheet .achip span{font-size:12px;color:var(--chalk-2)}
.lin{display:flex;flex-direction:column;gap:6px}
.lin-h{display:flex;align-items:center;gap:10px}.lin-h .rm{margin-left:auto}
.lin-scroll{overflow-x:auto;background:var(--felt);border:2px solid var(--felt-line);border-radius:6px;padding:4px}
.lin-svg{display:block;width:100%;min-width:480px;height:auto;font-family:var(--f-pixel)}
.lin-e{fill:none;stroke:var(--chalk-2);stroke-width:2}.lin-e.src,.lin-e.side{stroke-dasharray:5 4;stroke:var(--felt-line)}
.lin-lb{fill:var(--felt)}.lin-lt{fill:var(--chalk-2);font-size:11px}
.lin-n rect:first-of-type{fill:var(--paper);stroke-width:3}.lin-n .t{fill:var(--ink);font-size:12px}.lin-n .s{fill:var(--ink);opacity:.65;font-size:10px}
.lin-n[role=button]{cursor:pointer}.lin-n[role=button]:hover rect:first-of-type,.lin-n[role=button]:focus-visible rect:first-of-type{stroke:var(--accent)!important}.lin-n:focus{outline:none}
.lin-n.me rect:first-of-type{stroke-width:4;filter:drop-shadow(0 0 6px var(--accent))}.lin-n.gone{opacity:.45}
.lin-n.src rect{fill:transparent;stroke:var(--felt-line);stroke-width:2;stroke-dasharray:5 4}.lin-n.src .t{fill:var(--chalk-2);font-size:11px}
.lin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.lin-chip{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--paper);color:var(--ink);border:2px solid var(--tier);border-left:6px solid var(--kc);border-radius:4px;padding:6px 8px}
.lin-chip b{font-size:13px;font-weight:600}.lin-chip span{font-family:var(--f-pixel);font-size:11px;opacity:.65}.lin-chip:focus-visible{outline:2px solid var(--accent)}
.imgask{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);background:var(--felt-2);color:var(--chalk);border:3px solid var(--accent);border-radius:8px;padding:10px;box-shadow:0 6px 0 var(--shadow)}
.imgask img{width:56px;height:56px;object-fit:cover;border-radius:4px;border:2px solid var(--felt-line)}.imgask span{display:flex;flex-direction:column;gap:2px;min-width:0}.imgask small{color:var(--chalk-2);font-size:12px}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.sheet a{color:var(--accent)}
.sheet .close{margin-left:auto;background:none;border:none;color:var(--chalk-2);font-family:var(--f-pixel);cursor:pointer;font-size:14px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}

/* fx */
.helptip{position:fixed;z-index:200;max-width:260px;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:8px;box-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.helptip.show{opacity:1;transform:none}.helptip b{display:block;font-size:12px;opacity:.75;margin-bottom:2px}
[data-help]{text-decoration-line:none}
html:not(.nohelp) .sheet .acts [data-help]::after{content:"?";display:inline-block;margin-left:6px;width:14px;height:14px;line-height:14px;border-radius:50%;font-size:10px;text-align:center;background:color-mix(in srgb,currentColor 18%,transparent);vertical-align:1px}
@media (prefers-reduced-motion:reduce){.helptip{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(40px);opacity:0;transition:.25s;background:var(--paper);color:var(--ink);font-family:var(--f-pixel);padding:8px 14px;border-radius:4px;z-index:60;box-shadow:0 3px 0 var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:55;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 55%,transparent),transparent 60%);animation:flash .7s ease both}
@keyframes flash{from{opacity:1}to{opacity:0}}
.fusing{animation:fusing .6s ease both}
@keyframes fusing{0%{transform:none}50%{transform:scale(.85) rotate(4deg)}100%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* pouch + reward */
.pouch{width:36px;height:36px;image-rendering:pixelated;display:block}
.purse .cap{font-size:12px;opacity:.9;padding:1px 6px;border-radius:6px;border:1px solid color-mix(in srgb,var(--hdr-ink) 40%,transparent)}.purse .cap.full{background:var(--danger);color:#fff;border-color:transparent}
.capbar{background:var(--panel);border:2px dashed var(--danger);border-radius:10px;padding:10px 14px;margin:0 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.capbar p{margin:0;flex:1;min-width:200px}
.card .art.mosaic{display:grid;gap:1px;background:var(--paper-2)}.card .art.mosaic.n2{grid-template-columns:1fr 1fr}.card .art.mosaic.n3,.card .art.mosaic.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.card .art.mosaic.n3>:first-child{grid-row:span 2}
.card .art.mosaic>*{width:100%;height:100%;min-height:0;object-fit:cover;image-rendering:pixelated;display:block}
.album{display:flex;flex-direction:column;gap:8px;outline:none}.alview{display:flex;align-items:center;gap:8px}.alview>.btn{flex:none;font-size:20px;padding:6px 12px}
.albig{all:unset;cursor:pointer;flex:1;min-width:0;height:min(240px,32vw);border-radius:8px;overflow:hidden;background:var(--paper-2);box-shadow:0 4px 0 var(--shadow)}.albig:focus-visible{outline:3px solid var(--focus,#4f7bd1)}
.albig>*{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.alstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.alstrip button{all:unset;cursor:pointer;flex:none;width:64px;height:40px;border-radius:4px;overflow:hidden;opacity:.55;border:2px solid transparent}.alstrip button.on{opacity:1;border-color:var(--gold)}.alstrip button:focus-visible{outline:2px solid var(--focus,#4f7bd1)}
.alstrip button>*{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
.fopts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.fname{flex:1;min-width:180px;font:inherit;padding:6px 10px;border-radius:6px;border:2px solid var(--line,#999);background:var(--panel);color:inherit}.fgold{display:flex;gap:6px;align-items:center;cursor:pointer}
.card .heard{position:absolute;left:6px;bottom:6px;font-size:10px;padding:1px 5px;border-radius:3px;background:var(--paper-2);color:var(--ink);border:1px dashed currentColor}
.recaps{display:flex;flex-direction:column;gap:10px}.recap{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}.recap p{margin:4px 0 8px}
.memlist{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:6px}.memlist li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;background:var(--paper-2);padding:6px 10px;border-radius:6px}.memlist li .btn{flex:none;padding:2px 10px}
.mempre{white-space:pre-wrap;font:inherit;background:var(--paper-2);padding:8px 10px;border-radius:6px;margin:4px 0 10px}.memadd{margin-top:14px}
.pouchwrap{all:unset;position:relative;display:inline-flex;align-items:center;gap:4px;padding:2px 4px;border-radius:8px;cursor:default}
html.desk .pouchwrap{cursor:pointer}html.desk .pouchwrap:hover,.pouchwrap:focus-visible{background:color-mix(in srgb,var(--hdr-ink) 16%,transparent)}
.pouchwrap .caret{display:none;width:0;height:0;border:4px solid transparent;border-top:5px solid var(--hdr-ink);margin-top:5px}html.desk .pouchwrap .caret{display:block}
.pouchwrap.bump .pouch{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(1)}}
.flyer{position:fixed;z-index:70;pointer-events:none;border-radius:6px;border:3px solid var(--accent);background:var(--paper);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 70%,transparent);overflow:hidden}
.flyer img,.flyer canvas{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;display:block}
.spark{position:fixed;z-index:71;width:5px;height:5px;pointer-events:none;background:var(--accent)}
.plusone{position:fixed;z-index:72;pointer-events:none;font-family:var(--f-pixel);color:var(--accent);font-size:14px;text-shadow:0 2px 0 var(--shadow)}
/* errands and works (0035) */
.errbox{display:flex;flex-direction:column;gap:8px}
.errbox .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.errbox .row p{margin:0;flex:1 1 220px;font-size:13px;color:var(--chalk)}
.errbox ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.errbox li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--felt);border:1px solid var(--felt-line);border-radius:6px;padding:6px 10px}
.errbox li .what{flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.errbox li.failed{border-color:var(--danger,#c0392b)}
.work{display:flex;flex-direction:column;gap:8px}
.work img{max-width:100%;max-height:min(520px,60vh);object-fit:contain;border-radius:6px;align-self:center}
.worktext{white-space:pre-wrap;font-size:14px;line-height:1.7;max-height:52vh;overflow:auto;background:var(--felt);border:1px solid var(--felt-line);border-radius:6px;padding:12px 14px}
/* clip zone */
.clipzone{border:2px dashed var(--accent);border-radius:6px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.clipzone.over{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.clipzone p{margin:0;flex:1 1 220px;font-size:13px;color:var(--chalk)}
.clipzone kbd{font-family:var(--f-pixel);background:var(--felt);border:1px solid var(--felt-line);border-radius:3px;padding:0 5px;font-size:12px}
.clipzone label.btn{display:inline-block}
.clipzone input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.clipping{font-size:12px;color:var(--accent);font-family:var(--f-pixel)}
/* background */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2;image-rendering:pixelated;display:block}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 35%,transparent 45%,var(--vignette) 100%)}
/* sense page */
.hero{display:flex;flex-direction:column;gap:6px}
.hero h2{font-family:var(--f-pixel);font-weight:400;font-size:30px;margin:0;letter-spacing:.04em;text-wrap:balance}
.hero p{margin:0;color:var(--chalk-2);max-width:64ch}
.mapbox{position:relative;border:2px solid var(--felt-line);border-radius:8px;background:var(--sink);overflow:hidden}
.mapbox canvas{display:block;width:100%;height:300px;cursor:pointer}
.mapbox .legend{position:absolute;left:10px;bottom:8px;font-family:var(--f-pixel);font-size:11px;color:var(--chalk-2);display:flex;gap:10px;flex-wrap:wrap}
.forks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.forks li{border-left:3px solid var(--accent);padding:2px 0 2px 10px;font-size:14px;max-width:72ch}
.stiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.stile{background:linear-gradient(180deg,var(--felt-2),var(--sink));border:2px solid var(--felt-line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stile.conf{border-color:color-mix(in srgb,var(--accent) 55%,var(--felt-line))}
.stile h3{margin:0;font-size:16px;line-height:1.4;text-wrap:balance}
.stile .r{font-size:13px;color:var(--chalk-2)}
.stile .c{font-size:12px;color:var(--danger)}
.stile .learn{font-size:12px;color:var(--ok);display:flex;flex-direction:column;gap:2px}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.minis canvas,.minis img{width:44px;height:28px;image-rendering:pixelated;border-radius:2px;border:2px solid var(--tier,var(--stone));object-fit:cover;cursor:pointer}
.changes{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--chalk-2);margin:0;padding-left:18px}
/* table steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;background:var(--felt-2);border:2px solid var(--felt-line);border-radius:6px;padding:10px 12px;font-size:13px}
.steps li::before{content:counter(st);font-family:var(--f-pixel);color:var(--accent);font-size:18px;display:block}
/* survey effects */
.effects{background:color-mix(in srgb,var(--ok) 10%,transparent);border:2px solid color-mix(in srgb,var(--ok) 50%,var(--felt-line));border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px}
.effects b{font-family:var(--f-pixel);font-weight:400;color:var(--ok)}
.effects li{font-size:13px}
.how{font-size:12px;color:var(--chalk-2)}
footer{font-size:12px;color:var(--chalk-2);display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:2px solid var(--felt-line)}

/* sources */
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.src{background:var(--felt-2);border:2px solid var(--felt-line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.src-h{display:flex;align-items:center;gap:10px}.src-h b{font-family:var(--f-pixel);font-weight:400;font-size:16px}
.src-i{font-family:var(--f-pixel);font-size:12px;background:var(--paper);color:var(--ink);padding:2px 6px;border-radius:3px;min-width:28px;text-align:center}
.cliplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.cliplist li{border-left:3px solid var(--felt-line);padding-left:8px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.cliplist .w,.feed .w,.deliver .w{font-family:var(--f-pixel);font-size:11px;color:var(--chalk-2)}
.cliplist .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.candlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.candcard{background:var(--paper);color:var(--ink);border:3px solid var(--stone);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.candcard .k{font-family:var(--f-pixel);font-size:11px;display:flex;align-items:center;gap:4px}.candcard .k canvas{width:12px;height:12px;image-rendering:pixelated}
.candcard .note{color:var(--ink-2);font-size:12px}.candcard .btn{padding:5px 12px;font-size:13px}.candcard .btn.ghost{color:var(--ink);border-color:var(--paper-2)}
/* turntable */
.turn{position:relative;width:min(560px,100%);aspect-ratio:1;margin:0 auto}
.disc{position:absolute;inset:4%;border-radius:50%;border:8px solid var(--bronze);box-shadow:0 0 0 4px var(--deep),0 14px 0 var(--shadow),inset 0 0 40px var(--shadow);
  background:repeating-conic-gradient(var(--felt-2) 0 7.5deg,var(--felt) 7.5deg 15deg);animation:spin 120s linear infinite}
.ring{position:absolute;inset:0;animation:spin 120s linear infinite}
.seat{position:absolute;width:19%;transform:translate(-50%,-50%)}
.seat .upright{animation:spin 120s linear infinite reverse}
.seat .card{width:100%}.seat .card .attrs{display:none}.seat .card .t{-webkit-line-clamp:2;font-size:12px}
.seat.busy .upright>*{box-shadow:0 0 0 3px var(--accent),0 0 24px color-mix(in srgb,var(--accent) 80%,transparent);animation:pulse 1.2s ease-in-out infinite}
.seat-add{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;width:100%;border:2px dashed var(--felt-line);border-radius:6px;color:var(--chalk-2);font-family:var(--f-pixel);font-size:22px;background:var(--sink)}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--deep),var(--deep-2));border:4px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:10px;box-sizing:border-box}
.hub b{font-family:var(--f-pixel);font-weight:400;font-size:13px;color:var(--deep-ink);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hub span{font-size:11px;color:var(--accent);font-family:var(--f-pixel)}.hub .btn{font-size:12px;padding:5px 10px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--accent),0 0 6px color-mix(in srgb,var(--accent) 30%,transparent)}}
.tracks{display:flex;flex-direction:column;gap:12px}
.trk{background:var(--felt-2);border:2px solid var(--felt-line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.trk-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}.trk-h b{font-size:15px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.feed li{border-left:3px solid var(--felt-line);padding-left:8px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.feed li.update{border-color:var(--accent)}.feed li.found,.feed li.spawn{border-color:var(--bronze)}.feed li.against{border-color:var(--danger)}
.trk.paused{opacity:.6}
.feed a{color:var(--accent);font-size:12px}.feed .btn{padding:4px 10px;font-size:12px}
.tag-unverified.ok{color:var(--ok)}
/* use cases */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.case{background:linear-gradient(180deg,var(--deep),var(--deep-2));border:3px solid var(--bronze);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--deep-ink);min-width:0}
.case.done{border-color:var(--accent)}
.case .due{font-family:var(--f-pixel);font-size:12px;color:var(--accent)}
.case .qs{display:flex;gap:8px;flex-wrap:wrap}
.case .qslot{flex:1 1 80px;min-height:52px;border:2px dashed var(--deep-line);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:none;color:var(--deep-ink-2);font-family:inherit;padding:6px;text-align:center}
.case .qslot.filled{border-style:solid;border-color:var(--accent);color:var(--deep-ink)}
.case .note{color:var(--deep-ink-2)}
.uc{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;background:var(--paper);color:var(--ink);border:3px solid var(--accent);border-radius:6px;padding:10px;box-shadow:0 3px 0 var(--shadow);cursor:pointer;min-width:0}
.uc .uc-k{font-family:var(--f-pixel);font-size:11px;color:var(--accent-2)}.uc b{font-family:var(--f-pixel);font-weight:400;font-size:17px}.uc span{font-size:12px;color:var(--ink-2)}
.uc.small{aspect-ratio:3/4;justify-content:center;text-align:center}.uc.small b{font-size:13px}
.deliver{background:var(--sink);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:6px}
.deliver .txt{white-space:pre-wrap;font-size:13px;line-height:1.6}
/* showcase */
.showcase{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.poster{width:min(360px,100%);height:auto;border-radius:6px;box-shadow:0 8px 0 var(--shadow);image-rendering:pixelated}
.show-side{flex:1 1 220px;display:flex;flex-direction:column;gap:10px}

/* taste by domain */
.dom{display:flex;flex-direction:column;gap:10px}
.dsum{margin:0;font-size:14px;color:var(--chalk);max-width:72ch;border-left:3px solid var(--accent);padding-left:10px}
.titems{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.titem{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;background:var(--felt-2);border:2px dashed var(--felt-line);border-radius:6px;padding:10px;min-width:0;color:var(--chalk)}
.titem .k{font-family:var(--f-pixel);font-size:11px;color:var(--accent)}.titem b{font-size:14px;line-height:1.35}.titem span{font-size:12px;color:var(--chalk-2)}.titem .ev{font-size:11px}
.titem.pc{background:var(--paper);color:var(--ink);border:3px solid var(--tier,var(--stone));cursor:pointer}.titem.pc span{color:var(--ink-2)}.titem.pc .k{color:var(--ink-2)}
.titem.pc.bronze{--tier:var(--bronze)}.titem.pc.silver{--tier:var(--silver)}.titem.pc.gold{--tier:var(--gold)}
.titem.kept{border-style:solid;border-color:var(--bronze)}
.workstyle summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:8px}.workstyle summary em{font-style:normal;color:var(--chalk-2);font-size:12px}
.sec-like{font-family:var(--f-pixel);font-size:15px;letter-spacing:.08em}

/* sense page layout */
.sense-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:980px){.sense-grid{grid-template-columns:330px minmax(0,1fr);gap:28px}.sense-side{position:sticky;top:110px;align-self:start}}
.sense-side{display:flex;flex-direction:column;gap:12px}
.sense-side .poster{width:100%;max-width:400px;margin:0 auto}
.sense-side .note.err{color:var(--danger)}
.sense-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.sense-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sense-head h2{font-family:var(--f-pixel);font-weight:400;font-size:clamp(24px,3vw,34px);margin:0;color:var(--chalk);letter-spacing:.03em}
.domgrid{columns:3 280px;column-gap:16px}
.dpanel{break-inside:avoid;margin:0 0 16px;background:var(--felt-2);border:2px solid var(--felt-line);border-radius:12px;padding:14px 14px 10px;box-shadow:0 3px 0 var(--sink);display:flex;flex-direction:column;gap:8px}
.dpanel>.dhead{display:flex;align-items:center;gap:8px}
.dpanel h3{margin:0;font-family:var(--f-pixel);font-weight:400;font-size:17px;color:var(--chalk);display:flex;align-items:center;gap:8px}
.dpanel h3::before{content:"";width:10px;height:10px;background:var(--accent);box-shadow:3px 3px 0 var(--accent-2)}
.dpanel .dn{margin-left:auto;font-family:var(--f-pixel);font-size:12px;color:var(--on-accent);background:var(--accent);border-radius:99px;padding:1px 8px}

function isURL(t){return/^https?:\/\/\S+$/.test(t.trim());}
function hostOf(u){try{return new URL(u).host.replace(/^www\./,"");}catch(e){return"";}}

function onCopy(p){S.clips=S.clips||[];pruneClips();const t=p.text.trim();const wk=Date.now()-7*864e5;

/* ---------- background: dithered felt swirl ---------- */
(function(){const cv=$("#bg");const g=cv.getContext("2d");const P=5;let W=0,H=0,img=null,t=0,last=0;
  let C=[];const recolor=()=>{C=["--bg-a","--bg-b","--bg-c","--bg-d","--bg-e"].map(v=>hex2rgb(cssv(v)));};recolor();window.__bgRecolor=()=>{recolor();if(RM.matches)requestAnimationFrame(frame);};
  function size(){W=Math.ceil(innerWidth/P);H=Math.ceil(innerHeight/P);cv.width=W;cv.height=H;img=g.createImageData(W,H);}
  function frame(now){if(document.hidden){requestAnimationFrame(frame);return;}if(now-last<90&&!RM.matches){requestAnimationFrame(frame);return;}last=now;t+=.035;
    const d=img.data,cx=W*.5,cy=H*.3;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dx=x-cx,dy=y-cy,r=Math.sqrt(dx*dx+dy*dy)*.06,a=Math.atan2(dy,dx);
      let v=Math.sin(a*3+r*1.6-t)*.5+Math.sin(x*.045+t*.7)*.25+Math.sin(y*.06-t*.5+Math.sin(x*.02))*.25;v=(v+1)/2;v=v*(1-Math.min(1,r*.12)*.45);
      const th=BAYER[(y&3)*4+(x&3)]/16;let k=Math.floor(v*4+th*.9);k=k<0?0:k>4?4:k;const c=C[k];const o=(y*W+x)*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255;}
    g.putImageData(img,0,0);if(!RM.matches)requestAnimationFrame(frame);}
  size();addEventListener("resize",()=>{size();if(RM.matches)requestAnimationFrame(frame);});requestAnimationFrame(frame);})();
